<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <link rel="icon" href="assets/images/icons/favicon.ico" type="image/x-icon">
    <title>Our Server | DevenSMP</title>
    <link rel="stylesheet" href="css/all.css">
    <link rel="stylesheet" href="legacy_css/server.css">
    <script src="js/all.js" defer></script>
       <style>
        #maintenance-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle at center, #111827, #020617);
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 99999;
            animation: fadeIn 0.8s ease;
        }
        @keyframes fadeIn {
            from {
                opacity: 0;
            }
    
            to {
                opacity: 1;
            }
        }
        .maintenance-box {
            text-align: center;
            color: white;
            padding: 40px 50px;
            border-radius: 20px;
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
            box-shadow: 0 0 60px rgba(0, 0, 0, 0.6);
            animation: float 4s ease-in-out infinite;
        }
        @keyframes float {
            0%,
            100% {
                transform: translateY(0);
            }
            50% {
                transform: translateY(-10px);
            }
        }
        .maintenance-box h1 {
            font-size: 32px;
            margin-bottom: 10px;
        }
        .maintenance-box p {
            font-size: 16px;
            opacity: 0.75;
        }
        .spinner {
            margin: 25px auto;
            width: 50px;
            height: 50px;
            border: 5px solid rgba(255, 255, 255, 0.15);
            border-top: 5px solid #38bdf8;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }
        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }
        .glow {
            position: absolute;
            width: 300px;
            height: 300px;
            background: #38bdf8;
            filter: blur(120px);
            opacity: 0.2;
            animation: pulse 5s infinite ease-in-out;
        }
        @keyframes pulse {
            0%,
            100% {
                transform: scale(1);
                opacity: 0.2;
            }
            50% {
                transform: scale(1.3);
                opacity: 0.35;
            }
        }
        .particle {
            position: absolute;
            width: 3px;
            height: 3px;
            background: white;
            opacity: 0.3;
            border-radius: 50%;
            animation: moveUp linear infinite;
        }
        @keyframes moveUp {
            from {
                transform: translateY(100vh);
                opacity: 0;
            }
            to {
                transform: translateY(-10vh);
                opacity: 0.5;
            }
        }
    </style>
</head>
<body data-background="server">
<header class="site-header">
    <div class="header-inner">
      <button
    id="menuToggle"
    type="button"
    aria-label="Open navigation menu"
    aria-controls="menu"
    aria-expanded="false"
      >
        <img
          src="assets/images/main_menu.png"
          alt=""
          aria-hidden="true"
        >
      </button>

      <a class="home-logo" href="home" aria-label="DevenSMP home">
        <img
          src="assets/images/logo.png"
          alt="DevenSMP"
          id="topLogo"
        >
      </a>
    </div>

    <nav id="menu" class="side-menu" aria-label="Main navigation" aria-hidden="true">
      <a class="menu-logo-link" href="home" tabindex="-1">
        <img
          src="assets/images/logo.png"
          alt="DevenSMP home"
          id="menuLogo"
        >
      </a>

      <div id="links" class="menu-links">
        <a href="about">About Us</a>
        <a href="project">Projects</a>
        <a href="server">Server</a>
        <a href="legal">Legal</a>
        <a href="setting">Settings</a>
      </div>
    </nav>

    <div id="menuBackdrop" class="menu-backdrop" aria-hidden="true"></div>
  </header>
    <main>
       <div id="maintenance-overlay">
        <div class="glow"></div>
        <div id="particles"></div>
        <div class="maintenance-box">
            <h1>🚧 Under Maintenance</h1>
            <div class="spinner"></div>
            <p>We're upgrading the site.<br>Please come back later!</p>
        </div>
    </div>
        <div class="box">
        <h2>Want to Join Our Minecraft Server?</h2>
        <h4>Bedrock IP: devensmp.minecraft.pe<br>Port: 8800</h4>
        <button type="button" onclick="addServer_()">Add Server</button>
        <b>Status: Open 24/7</b>
        </div>
    </main>
    <script>
        function addServer() {
            window.location.href = 'minecraft:?addExternalServer=DevenSMP|devensmp.minecraft.pe:8800';
        }
    </script>
</body>
</html>
